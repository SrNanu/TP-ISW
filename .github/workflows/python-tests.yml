# Nombre del workflow que aparecerá en la pestaña "Actions" de GitHub
name: Python Application Tests

# Define los eventos que dispararán la ejecución de este workflow
on:
  push:
    branches: [ "main" ] # Se ejecuta cada vez que se hace push a la rama main
  pull_request:
    branches: [ "main" ] # Se ejecuta cada vez que se abre una Pull Request hacia main

# Define los trabajos (jobs) que se ejecutarán. Podemos tener varios.
jobs:
  build:
    # El tipo de máquina virtual donde se ejecutarán las pruebas.
    # 'ubuntu-latest' es una opción común y económica.
    runs-on: ubuntu-latest

    # Los pasos (steps) que componen el trabajo. Se ejecutan en secuencia.
    steps:
      # 1. Clona tu repositorio en la máquina virtual
      # Para que el workflow tenga acceso a tu código.
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. Configura el entorno de Python
      # Especifica la versión de Python que quieres usar.
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Instala las dependencias
      # En este caso, solo necesitamos PyTest.
      # En un proyecto real, aquí instalarías desde un archivo requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # 4. Ejecuta las pruebas
      # Llama a PyTest para que descubra y ejecute los tests en el repositorio.
      - name: Run tests with PyTest
        run: |
          pytest